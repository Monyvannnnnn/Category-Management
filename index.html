        const OX = 900;
        const OY = 120;

        /**
         * Dimetric Projection Math: 22.5° Wide Three-Quarter Diamond Projection
         * cos(22.5°) = 0.924, sin(22.5°) = 0.383
         */
        function isoProject(x, y) {
            return {
                sx: OX + 0.924 * (x - y),
                sy: OY + 0.383 * (x + y)
            };
        }

        /**
         * Helper to generate smooth rounded corners for Orthogonal (H/V) Path Segments
         */
        function buildOrthogonalPath(points, radius = 24) {
            if (!points || points.length < 2) return '';
            let d = `M ${points[0].x} ${points[0].y}`;

            for (let i = 1; i < points.length - 1; i++) {
                const prev = points[i - 1];
                const curr = points[i];
                const next = points[i + 1];

                const dx1 = curr.x - prev.x;
                const dy1 = curr.y - prev.y;
                const len1 = Math.hypot(dx1, dy1);

                const dx2 = next.x - curr.x;
                const dy2 = next.y - curr.y;
                const len2 = Math.hypot(dx2, dy2);

                const r = Math.min(radius, len1 / 2, len2 / 2);

                const p1x = curr.x - (dx1 / len1) * r;
                const p1y = curr.y - (dy1 / len1) * r;

                const p2x = curr.x + (dx2 / len2) * r;
                const p2y = curr.y + (dy2 / len2) * r;

                d += ` L ${p1x} ${p1y} Q ${curr.x} ${curr.y} ${p2x} ${p2y}`;
            }

            d += ` L ${points[points.length - 1].x} ${points[points.length - 1].y}`;
            return d;
        }

                { id: 'u-supplier-truck', x: -480, y: 1560, width: 180, height: 150, label: 'A. Supplier Deliver Goods', assetImg: 'asset/3d-rendering-delivery-icon.png', offX: -70, offY: 0, accentColor: '#A78BFA' },
                { id: 'u-receiving', x: -220, y: 1560, width: 144, height: 138, label: 'B. Receiving', assetImg: 'asset/receiving.png', offX: 0, offY: 45, accentColor: '#A78BFA' },
                { id: 'u-inspect-p', x: 40, y: 1780, width: 132, height: 144, label: 'C. Inspection', assetImg: 'asset/—Pngtree—3d checklist with green checkmarks_23591523.png', offX: 0, offY: 45, accentColor: '#A78BFA' },
                { id: 'u-putaway', x: 160, y: 1480, width: 144, height: 138, label: 'D. Put-Away', assetImg: 'asset/receiving.png', offX: 65, offY: 0, accentColor: '#A78BFA' },

                { id: 'u-merchandising', x: 880, y: -30, width: 132, height: 140, label: 'M. Merchandising & Display', assetImg: 'asset/merchandising.png', offX: 65, offY: 0, accentColor: '#FF5C8A' }
            ]
        };

        function getUprightContent(w, h, assetImg) {
            if (!assetImg) return '';
            return `<image href="${assetImg}" x="0" y="0" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet"/>`;
        }

        function renderLabelBadge(label, accentColor, h) {
            if (!label) return '';
            const fontCharWidth = 9.2;
            const padding = 28;
            const textWidth = label.length * fontCharWidth;
            const pillWidth = Math.max(120, textWidth + padding);
            const pillHeight = 34;
            const pillX = -pillWidth / 2;
            const pillY = -h - 42;

            return `
                <g class="upright-label-group">
                    <rect class="upright-label-bg" x="${pillX}" y="${pillY}" width="${pillWidth}" height="${pillHeight}" rx="8" 
                          fill="rgba(255, 255, 255, 0.95)" stroke="${accentColor || '#0284c7'}" stroke-width="2" 
                          filter="drop-shadow(0 4px 10px rgba(0,0,0,0.15))"/>
                    <text class="upright-label-text" x="0" y="${pillY + pillHeight / 2 + 1}">${label}</text>
                </g>
            `;
        }

        /**
         * Main Render Function
         */
        function renderDiagram() {
            const routesContainer = document.getElementById('routes-container');
            const nodesContainer = document.getElementById('nodes-container');
            const uprightContainer = document.getElementById('upright-container');

            routesContainer.innerHTML = '';
            nodesContainer.innerHTML = '';
            uprightContainer.innerHTML = '';

            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

            // 1. Render Orthogonal Routes & Step Badges
            WORKFLOW_DATA.routes.forEach(route => {
                const pathId = `path-${route.id}`;
                const pathD = buildOrthogonalPath(route.points, 24);

                route.points.forEach(p => {
                    const proj = isoProject(p.x, p.y);
                    minX = Math.min(minX, proj.sx);
                    maxX = Math.max(maxX, proj.sx);
                    minY = Math.min(minY, proj.sy);
                    maxY = Math.max(maxY, proj.sy);
                });

                // Route Path
                const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathEl.setAttribute('id', pathId);
                pathEl.setAttribute('d', pathD);
                pathEl.setAttribute('class', `route-path ${route.dashed ? 'dashed' : ''}`);
                pathEl.setAttribute('stroke', route.color);
                if (route.marker) {
                    pathEl.setAttribute('marker-end', route.marker);
                }
                pathEl.dataset.routeId = route.id;
                routesContainer.appendChild(pathEl);

                // Motion Packets along Route
                if (!route.dashed) {
                    const particleGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    particleGroup.setAttribute('class', 'packet-particle');
                    particleGroup.style.color = route.color;

                    const circleParticle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circleParticle.setAttribute('r', '8.5');
                    circleParticle.setAttribute('fill', route.color);
                    circleParticle.setAttribute('stroke', '#ffffff');
                    circleParticle.setAttribute('stroke-width', '2.5');
                    particleGroup.appendChild(circleParticle);

                    const animMotion = document.createElementNS('http://www.w3.org/2000/svg', 'animateMotion');
                    animMotion.setAttribute('dur', '8s');
                    animMotion.setAttribute('repeatCount', 'indefinite');
                    animMotion.setAttribute('rotate', 'auto');

                    const mpath = document.createElementNS('http://www.w3.org/2000/svg', 'mpath');
                    mpath.setAttribute('href', `#${pathId}`);
                    mpath.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', `#${pathId}`);
                    animMotion.appendChild(mpath);

                    particleGroup.appendChild(animMotion);
                    routesContainer.appendChild(particleGroup);

                    try {
                        animMotion.beginElement();
                    } catch (e) {}
                }

                // Numbered White Circle Step Badges in Screen Space
                route.nodes.forEach(node => {
                    const proj = isoProject(node.x, node.y);
                    const nodeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    nodeG.setAttribute('class', 'node-group');
                    nodeG.setAttribute('transform', `translate(${proj.sx.toFixed(1)}, ${proj.sy.toFixed(1)})`);
                    nodeG.setAttribute('tabindex', '0');
                    nodeG.setAttribute('role', 'button');
                    nodeG.setAttribute('aria-label', `Step ${node.label}: ${node.title}`);
                    nodeG.dataset.routeId = route.id;
                    nodeG.dataset.nodeId = node.id;
                    nodeG.dataset.title = node.title;
                    nodeG.dataset.desc = node.desc;
                    nodeG.dataset.color = route.color;

                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('class', 'node-circle');
                    circle.setAttribute('cx', '0');
                    circle.setAttribute('cy', '0');
                    circle.setAttribute('r', '17');
                    circle.setAttribute('stroke', route.color);

                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('class', 'node-text');
                    text.setAttribute('x', '0');
                    text.setAttribute('y', '0');
                    text.textContent = node.label;

                    nodeG.appendChild(circle);
                    nodeG.appendChild(text);

                    nodeG.addEventListener('mouseenter', handleNodeHover);
                    nodeG.addEventListener('mouseleave', handleNodeLeave);
                    nodeG.addEventListener('focus', handleNodeHover);
                    nodeG.addEventListener('blur', handleNodeLeave);

                    nodesContainer.appendChild(nodeG);
                });
            });

            // 2. Depth Sort Upright Billboards by screen Y (Painter's Algorithm)
            WORKFLOW_DATA.uprights.forEach(u => {
                const posX = u.x + (u.offX || 0);
                const posY = u.y + (u.offY || 0);
                const proj = isoProject(posX, posY);
                u.sx = proj.sx;
                u.sy = proj.sy;

                minX = Math.min(minX, u.sx - u.width / 2 - 30);
                maxX = Math.max(maxX, u.sx + u.width / 2 + 30);
                minY = Math.min(minY, u.sy - u.height - 65);
                maxY = Math.max(maxY, u.sy + 30);
            });

            WORKFLOW_DATA.uprights.sort((a, b) => a.sy - b.sy);

            // 3. Render Image Billboards & Upright Step Badges with Static Hit Target (Zero Hover Glitch)
            WORKFLOW_DATA.uprights.forEach(u => {
                const uprightG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                uprightG.setAttribute('id', u.id);
                uprightG.setAttribute('class', 'upright-group');
                uprightG.setAttribute('transform', `translate(${u.sx}, ${u.sy})`);

                const shadowRx = Math.max(14, u.width * 0.38);
                const shadowRy = Math.max(8, u.width * 0.12);

                const hitBoxMarkup = `
                    <!-- Static Invisible Hit Target prevents hover glitching completely -->
                    <rect class="hit-target" x="${-u.width / 2 - 12}" y="${-u.height - 38}" width="${u.width + 24}" height="${u.height + 48}" fill="transparent"/>
                `;

                const shadowMarkup = u.assetImg ? `
                    <!-- Dark Ellipse Ground Shadow -->
                    <ellipse class="ground-shadow" cx="0" cy="0" rx="${shadowRx}" ry="${shadowRy}" fill="#000000" fill-opacity="0.15" filter="url(#shadow-blur)"/>
                ` : '';

                const imageMarkup = u.assetImg ? `
                    <!-- Moderately Scaled Asset Image Bottom-Center Anchored -->
                    <g class="upright-image-container" transform="translate(${-u.width / 2}, ${-u.height})">
                        ${getUprightContent(u.width, u.height, u.assetImg)}
                    </g>
                ` : '';

                const labelMarkup = renderLabelBadge(u.label, u.accentColor, u.height);

                uprightG.innerHTML = `
                    ${hitBoxMarkup}
                    ${shadowMarkup}
                    <g class="upright-content">
                        ${imageMarkup}
                        ${labelMarkup}
                    </g>
                `;

                uprightContainer.appendChild(uprightG);
            });

            // 4. Auto-Compute ViewBox for Tight Fit (No artificial padding or shrink)
            const pad = 30;
            minX -= pad;
            minY -= pad;
            maxX += pad;
            maxY += pad;

            const vbWidth = Math.max(100, maxX - minX);
            const vbHeight = Math.max(100, maxY - minY);

            const svg = document.getElementById('workflow-svg');
            svg.setAttribute('viewBox', `${minX.toFixed(1)} ${minY.toFixed(1)} ${vbWidth.toFixed(1)} ${vbHeight.toFixed(1)}`);
            try {
                svg.unpauseAnimations();
            } catch(e) {}
        }

        /**
         * Interactive Tooltip & Highlight Event Handlers
         */
        const tooltipEl = document.getElementById('diagram-tooltip');

        function handleNodeHover(e) {
            const target = e.currentTarget;
            const routeId = target.dataset.routeId;
            const title = target.dataset.title;
            const desc = target.dataset.desc;
            const color = target.dataset.color;
            const nodeTextEl = target.querySelector('.node-text');
            const label = nodeTextEl ? nodeTextEl.textContent : (target.dataset.nodeId || '');

            document.querySelectorAll('.route-path').forEach(path => {
                if (path.dataset.routeId === routeId) {
                    path.classList.add('highlighted');
                } else {
                    path.classList.add('dimmed');
                }
            });

            document.querySelectorAll('.node-group').forEach(ng => {
                if (ng.dataset.routeId !== routeId) {
                    ng.classList.add('dimmed');
                }
            });

            tooltipEl.innerHTML = `
                <div class="tooltip-header">
                    <span class="tooltip-badge" style="background:${color}">${label}</span>
                    <span>${title}</span>
                </div>
                <div class="tooltip-desc">${desc}</div>
            `;

            const bbox = target.getBoundingClientRect();
            const wrapperBbox = document.querySelector('.diagram-wrapper').getBoundingClientRect();
            
            const left = bbox.left - wrapperBbox.left + (bbox.width / 2);
            const top = bbox.top - wrapperBbox.top;

            tooltipEl.style.left = `${left}px`;
            tooltipEl.style.top = `${top}px`;
            tooltipEl.classList.add('visible');
        }

        function handleNodeLeave() {
            document.querySelectorAll('.route-path').forEach(path => {
                path.classList.remove('highlighted', 'dimmed');
            });
            document.querySelectorAll('.node-group').forEach(ng => {
                ng.classList.remove('dimmed');
            });
            tooltipEl.classList.remove('visible');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderDiagram();
            window.addEventListener('resize', renderDiagram);
        });
    </script>
