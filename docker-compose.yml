version: '3.8'

services:
  # ----------------------------------------------------
  # Web Application Service (Apache + PHP 8.2)
  # ----------------------------------------------------
  web:
    build: .
    container_name: inventory_web
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: inventory_user
      DB_PASS: inventory_pass
      DB_NAME: inventory_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html

  # ----------------------------------------------------
  # Telegram Bot Daemon Service (Real-time Long Poller)
  # ----------------------------------------------------
  telegram_bot:
    build: .
    container_name: inventory_telegram_bot
    restart: always
    command: php bot_poller_daemon.php
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html

  # ----------------------------------------------------
  # MySQL Database Service
  # ----------------------------------------------------
  db:
    image: mysql:8.0
    container_name: inventory_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: inventory_user
      MYSQL_PASSWORD: inventory_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

# Persistent volume for MySQL database
volumes:
  db_data:
